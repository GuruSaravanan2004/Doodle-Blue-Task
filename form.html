<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration Form</title>
</head>
<link rel="stylesheet" href="style.css">
<body>

    <h2>Registration Form</h2>

    <div>

    <form action="/register" method="post">

        <label for="name">FULL NAME</label>
        <input type="text" name="name" id="name"  required>
        <br><br>

        <label for="age">AGE</label>
        <input type="number" name="age" id="age" required>
        <br><br>

        <label for="course">COURSE</label>
        <select name="course" id="course" required>
            <option value="">Select your course</option>
            <option value="CSE">Computer Science</option>
            <option value="AIDS">Artificial Intelligence & Data Science</option>
            <option value="CE">Civil Engineering</option>
        </select>

        <br><br>

        <label for="email">EMAIL</label>
        <input type="email" id="email" name="email" required>
        <br><br>

        <label for="password">PASSWORD</label>
        <input type="password" name="password" id="password" required>
        <br><br>

        <label for="phone">MOBILE NUMBER</label>
        <input type="tel" name="phone" id="phone"  required>
        <br><br>

        <label for="dob">DATE OF BIRTH</label>
        <input type="date" name="dob" id="dob" required>
        <br><br>

        <p>GENDER</p>

        <input type="radio" id="male" name="gender" value="male" required>
        <label for="male">Male</label>

        <input type="radio" id="female" name="gender" value="female">
        <label for="female">Female</label>

        <input type="radio" id="other" name="gender" value="other">
        <label for="other">Other</label>
        <br><br>


        <p>SKILLS</p>
        <label for="skill-html">
            <input type="checkbox" id="skill-html" name="skills" value="html">HTML</label>
                <label for="skill-css">
                <input type="checkbox" id="skill-css" name="skills" value="css">CSS</label>
                <label for="skill-js">
                <input type="checkbox" id="skill-js" name="skills" value="js">Javascript</label>
                <br><br>

        <p>SKILL LEVEL</p>

        <input type="radio" id="beginner" name="level" value="beginner" required>
        <label for="beginner">Beginner</label>

        <input type="radio" id="intermediate" name="level" value="intermediate">
        <label for="intermediate">Intermediate</label>

        <input type="radio" id="advanced" name="level" value="advanced">
        <label for="advanced">Advanced</label>
        <br><br>

        <br><br>

        <button type="submit">Create Account</button>
        <button type="reset">Clear</button>

    </form>
    </div>

</body>
</html>


<style>
    body {
        background-color: #f4f6f9;
        padding: 20px;
    }

    h2 {
        text-align: center;
        background-color: #baadad;
        padding: 15px;
        border-radius: 8px;
        margin-bottom: 20px;
    }

    form {
        text-justify: auto;
        max-width: 500px;
        margin: auto;
        padding: 25px;
        background-color: white;
        border-radius: 10px;
        
    }


    button {
        padding: 10px 20px;
        margin: 10px 5px 0 0;
        background-color: #2563eb;
        color: rgb(244, 241, 241);
        border-radius: 8px;
        cursor: pointer;
    }

    button:hover {
        background-color: #3757af;
    }
</style>
